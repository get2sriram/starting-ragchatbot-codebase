name: Claude Code Review
on: [pull_request]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Pass OpenRouter key as the primary API key
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
        env:
          # Point to OpenRouter's Anthropic-compatible endpoint
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          # Optional: Specify which OpenRouter model to use (default is often Sonnet)
          ANTHROPIC_MODEL: minimax/minimax-m2.5:free

name: Claude Issue-to-PR
on:
  issue_comment:
    types: [created]

permissions:
  contents: write       # Required to create branches and push code
  pull-requests: write  # Required to open the PR
  issues: read          # Required to read the issue context

jobs:
  claude-worker:
    # Only run if '@claude' is mentioned in the comment
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # Explicitly instruct Claude to implement the issue and open a PR
          prompt: "Implement the feature or fix requested in this issue and open a pull request."
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_MODEL: minimax/minimax-m2.5:free # Or your preferred model

